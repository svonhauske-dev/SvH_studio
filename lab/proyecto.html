<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proyecto</title><link rel="stylesheet" href="/lab/lab.css">
<style>
body{--fg:#F2EFEA}
.cab{background:var(--c);color:#F2EFEA;min-height:62svh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(1.5rem,5vw,3.5rem) clamp(1rem,4vw,2rem)}
.cab .eye{max-width:62rem;margin:0 auto;width:100%}
.cab .t{max-width:62rem;margin:0 auto;width:100%}
.cab h1{margin:0;max-width:none;font-size:clamp(3rem,13vw,8rem);animation:sube .7s cubic-bezier(.22,1,.36,1) both}
.cab .d{opacity:.78;margin-top:.75rem;animation:sube .7s .08s cubic-bezier(.22,1,.36,1) both}
@keyframes sube{from{opacity:0;transform:translateY(18px)}}
.pant{background:var(--c);padding:0 clamp(1rem,4vw,2rem) clamp(2rem,6vw,4rem)}
.pant picture,.pant img{max-width:62rem;margin:0 auto;width:100%;border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:sube .8s .15s cubic-bezier(.22,1,.36,1) both}
.cuerpo{background:var(--svh-paper);color:var(--svh-ink)}
.cuerpo .in{max-width:62rem;margin:0 auto;padding:clamp(2.5rem,7vw,4.5rem) clamp(1rem,4vw,2rem)}
.ctx{font-family:var(--svh-serif);font-size:clamp(1.5rem,4.4vw,2.5rem);line-height:1.15;max-width:28ch;margin:0}
.hizo{list-style:none;padding:0;margin:2rem 0 0;display:grid;gap:0 2rem}
@media (min-width:700px){.hizo{grid-template-columns:repeat(3,1fr)}}
.hizo li{border-top:1px solid var(--svh-rule);padding:.8rem 0;color:var(--svh-dim)}
.visita{display:inline-block;margin-top:1.5rem;font-weight:500;text-underline-offset:.25em}
.sig{display:block;background:var(--cn);color:#F2EFEA;text-decoration:none;padding:clamp(2rem,7vw,4rem) clamp(1rem,4vw,2rem)}
.sig .in{max-width:62rem;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.sig small{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;opacity:.75}
.sig .n{font-family:var(--svh-serif);font-size:clamp(2.25rem,9vw,5rem);line-height:1}
.atras{display:block;text-align:center;padding:1.5rem;color:var(--svh-dim);background:var(--svh-paper)}
</style></head><body>
<header class="cab"><div class="eye"><a href="javascript:history.back()">← Trabajo</a><span id="cont"></span></div>
  <div class="t"><h1 class="serif" id="n"></h1><div class="d" id="d"></div></div></header>
<div class="pant"><picture><source media="(max-width:599px)" id="srcm"><img id="img" alt=""></picture></div>
<section class="cuerpo"><div class="in"><p class="ctx" id="ctx"></p><ul class="hizo" id="hizo"></ul>
  <a class="visita" id="url" target="_blank" rel="noopener"></a></div></section>
<a class="sig" id="sig"><div class="in"><div><small>Siguiente</small><div class="n" id="sn"></div></div><span class="n">→</span></div></a>
<a class="atras" href="javascript:history.back()">Volver a todos</a>
<script src="/lab/data.js"></script>
<script>
var k=new URLSearchParams(location.search).get('p')||'jabali',i=PROYECTOS.findIndex(function(p){return p.k===k});if(i<0)i=0;
var p=PROYECTOS[i],q=PROYECTOS[(i+1)%5],$=function(x){return document.getElementById(x)};
document.title=p.n+' — SvH Studio (lab)';
document.body.style.setProperty('--c',p.c);document.body.style.setProperty('--cn',q.c);document.body.style.background=p.c;
$('n').textContent=p.n;$('d').textContent=p.tag;$('cont').textContent=(i+1)+'/5';
$('srcm').srcset='/images/sitios/'+p.k+'-mov-600.webp';$('img').src='/images/sitios/'+p.k+'-esc-1600.webp';$('img').alt='Portada de '+p.dom;
$('ctx').textContent=p.ctx;$('hizo').innerHTML=p.hizo.map(function(h){return '<li>'+h+'</li>'}).join('');
$('url').href=p.url;$('url').textContent='Ver el sitio ↗';
$('sn').textContent=q.n;$('sig').href=pagina(q.k);$('sig').onclick=function(e){inundar(e,q.c,pagina(q.k))};
</script></body></html>
