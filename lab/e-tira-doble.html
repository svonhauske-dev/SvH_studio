<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E · Tira con escritorio y celular</title><link rel="stylesheet" href="/lab/lab.css">
<style>
.tira{display:flex;gap:clamp(1rem,3vw,2rem);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  --w:min(84vw,46rem);padding:2.25rem calc(50% - var(--w) / 2) 1rem;margin:0 calc(-1 * clamp(1rem,4vw,2rem))}
.tira::-webkit-scrollbar{display:none}
.lamina{flex:0 0 var(--w);scroll-snap-align:center;scroll-snap-stop:always;border:0;background:none;padding:0;color:inherit;cursor:pointer;
  transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .5s}
.lamina:not(.activa){transform:scale(.92);opacity:.45}
.lamina.activa{cursor:default}
/* Escritorio y celular juntos, sin marco de dispositivo: el sitio a sangre,
   y su versión de celular encimada en la esquina, a escala real entre sí. */
.comp{position:relative;padding:0 13% 9% 0}
.esc,.mov{overflow:hidden;outline:1px solid rgba(242,239,234,.22);outline-offset:-1px;box-shadow:0 22px 60px rgba(0,0,0,.32)}
.esc{aspect-ratio:16/10;border-radius:6px}
.mov{position:absolute;right:0;bottom:0;width:25%;aspect-ratio:1/2;border-radius:12px}
.esc img,.mov img{width:100%;height:100%;object-fit:cover;object-position:top}
.mov{transition:transform .6s cubic-bezier(.22,1,.36,1)}
.lamina:not(.activa) .mov{transform:translateY(8%)}
.pie{max-width:var(--w);margin:1.25rem auto 0;display:grid;gap:.5rem;min-height:11rem}
.pie .fila{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.pie .n{font-family:var(--svh-serif);font-size:var(--t-row);line-height:1}
.pie .cont{font-size:.75rem;letter-spacing:.3em}
.pie .d{opacity:.78;font-size:.95rem}
.pie .ctx{opacity:.66;font-size:.95rem;max-width:52ch;margin:0}
.pie a{justify-self:start;margin-top:.25rem;font-weight:500;text-underline-offset:.25em;text-decoration-thickness:1px}
.pie > *{transition:opacity .25s}
.pie.cambia > *{opacity:0}
.flechas{display:none;gap:.75rem}
.flechas button{font:inherit;font-family:var(--svh-serif);font-size:1.4rem;background:none;border:1px solid currentColor;color:inherit;border-radius:999px;width:2.75rem;height:2.75rem;cursor:pointer;opacity:.8}
.flechas button:disabled{opacity:.25;cursor:default}
@media (pointer:fine){.flechas{display:flex}}
.label{align-items:flex-end}.label .r{display:flex;gap:1rem;align-items:center;margin-block:-.5rem 0}
</style></head><body>
<div class="wrap">
  <div class="eye"><a href="/lab/">← Laboratorio</a><span>E · Escritorio y celular</span></div>
  <h1>Tu sitio debería verse <em>tan bueno</em> como tu lugar.</h1>
  <p class="lede">Diseño y programo sitios para restaurantes, cafés y bares en la Ciudad de México.</p>
  <div class="label"><span>Trabajo</span><span class="r"><span class="flechas"><button id="ant" aria-label="Anterior">←</button><button id="sig" aria-label="Siguiente">→</button></span><span id="cont">1/5</span></span></div>
  <div class="tira" id="tira" aria-roledescription="carrusel"></div>
  <div class="pie" id="pie" aria-live="polite">
    <div class="fila"><span class="n" id="pn"></span></div>
    <div class="d" id="pd"></div>
    <p class="ctx" id="pc"></p>
    <a id="pu" target="_blank" rel="noopener"></a>
  </div>
</div>
<p class="nota">Desliza · el texto de abajo cambia con cada sitio</p>
<script src="/lab/data.js"></script>
<script>
var T=document.getElementById('tira'),act=-1,$=function(x){return document.getElementById(x)};
PROYECTOS.forEach(function(p,i){
  var b=document.createElement('button');b.className='lamina';b._i=i;b.setAttribute('aria-label',p.n);
  b.innerHTML='<div class="comp"><div class="esc"><img src="/images/sitios/'+p.k+'-esc-1600.webp" alt="" loading="'+(i<2?'eager':'lazy')+'"></div>'+
    '<div class="mov"><img src="/images/sitios/'+p.k+'-mov-600.webp" alt="" loading="'+(i<2?'eager':'lazy')+'"></div></div>';
  b.onclick=function(){ if(i!==act) ir(i) };
  T.appendChild(b);
});
var ls=[].slice.call(T.children),pie=$('pie');
function marcar(i){
  if(i===act)return; act=i; var p=PROYECTOS[i];
  ls.forEach(function(t,j){t.classList.toggle('activa',j===i)});
  document.body.style.setProperty('--bg',p.c);document.body.style.setProperty('--fg','#F2EFEA');
  $('cont').textContent=(i+1)+'/5';$('ant').disabled=i===0;$('sig').disabled=i===4;
  pie.classList.add('cambia');
  setTimeout(function(){
    $('pn').textContent=p.n;$('pd').textContent=p.tag;$('pc').textContent=p.ctx;
    $('pu').href=p.url;$('pu').textContent='Ver el sitio · '+p.dom+' ↗';
    pie.classList.remove('cambia');
  },act===i&&$('pn').textContent?180:0);
}
function ir(i){i=Math.max(0,Math.min(4,i));T.scrollTo({left:ls[i].offsetLeft-(T.clientWidth-ls[i].offsetWidth)/2,behavior:'smooth'})}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)marcar(e.target._i)})},{root:T,rootMargin:'0px -49% 0px -49%'});
ls.forEach(function(t){io.observe(t)});
$('ant').onclick=function(){ir(act-1)};$('sig').onclick=function(){ir(act+1)};
T.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){e.preventDefault();ir(act+1)}if(e.key==='ArrowLeft'){e.preventDefault();ir(act-1)}});
marcar(0);
</script></body></html>
