<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · Índice y tira</title><link rel="stylesheet" href="/lab/lab.css">
<style>
.tira{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding:2rem calc(50% - min(31vw,8.5rem)) 1rem;margin:0 calc(-1 * clamp(1rem,4vw,2rem))}
.tira::-webkit-scrollbar{display:none}
.tarjeta{flex:0 0 min(62vw,17rem);scroll-snap-align:center;scroll-snap-stop:always;text-decoration:none;
  transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .5s}
.tarjeta:not(.activa){transform:scale(.9);opacity:.55}
.tarjeta .pant{aspect-ratio:1/2;border-radius:14px;overflow:hidden;outline:1px solid rgba(242,239,234,.22);outline-offset:-1px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.tarjeta img{width:100%;height:100%;object-fit:cover;object-position:top}
.pie{text-align:center;margin-top:1rem;min-height:5.5rem}
.pie .n{font-family:var(--svh-serif);font-size:var(--t-row);line-height:1}
.pie .d{opacity:.72;margin-top:.5rem;font-size:.95rem}
.cont{font-size:.75rem;letter-spacing:.3em}
.flechas{display:none;justify-content:center;gap:1rem;margin-top:1rem}
.flechas button{font:inherit;font-family:var(--svh-serif);font-size:1.5rem;background:none;border:1px solid currentColor;color:inherit;border-radius:999px;width:3rem;height:3rem;cursor:pointer}
@media (pointer:fine){.flechas{display:flex}}
.nombres{list-style:none;margin:1.25rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.2rem 1.1rem}
.nombres button{font:inherit;font-family:var(--svh-serif);font-size:clamp(1.5rem,5vw,2.25rem);background:none;border:0;color:inherit;padding:0;cursor:pointer;opacity:.4;transition:opacity .4s}
.nombres button.activo{opacity:1;font-style:italic}
.pie .n{display:none}
</style></head><body>
<div class="wrap">
  <div class="eye"><a href="/lab/">← Laboratorio</a><span>C · Índice y tira</span></div>
  <h1>Tu sitio debería verse <em>tan bueno</em> como tu lugar.</h1>
  <p class="lede">Diseño y programo sitios para restaurantes, cafés y bares en la Ciudad de México.</p>
  <div class="label"><span>Trabajo</span><span class="cont" id="cont">1/5</span></div>
  <ul class="nombres" id="nombres"></ul>
  <div class="tira" id="tira"></div>
  <div class="pie"><div class="n" id="pn"></div><div class="d" id="pd"></div></div>
  <div class="flechas"><button id="ant" aria-label="Anterior">←</button><button id="sig" aria-label="Siguiente">→</button></div>
</div>
<p class="nota">Toca un nombre o desliza · toca la pantalla para abrirla</p>
<script src="/lab/data.js"></script>
<script>
var T=document.getElementById('tira'),act=0;
PROYECTOS.forEach(function(p,i){
  var a=document.createElement('a');a.className='tarjeta';a.href=pagina(p.k);a._i=i;
  a.innerHTML='<div class="pant"><img src="/images/sitios/'+p.k+'-mov-600.webp" alt="'+p.n+'"></div>';
  a.onclick=function(e){ if(i!==act){e.preventDefault();ir(i);return} inundar(e,p.c,pagina(p.k)) };
  T.appendChild(a);
});
var ts=[].slice.call(T.children),N=document.getElementById('nombres');
PROYECTOS.forEach(function(p,i){var li=document.createElement('li'),b=document.createElement('button');b.textContent=p.n;b.onclick=function(){ir(i)};li.appendChild(b);N.appendChild(li)});
var bs=[].slice.call(N.querySelectorAll('button'));
function marcar(i){
  act=i;var p=PROYECTOS[i];
  ts.forEach(function(t,j){t.classList.toggle('activa',j===i)});bs.forEach(function(b,j){b.classList.toggle('activo',j===i)});
  document.body.style.setProperty('--bg',p.c);document.body.style.setProperty('--fg','#F2EFEA');
  document.getElementById('pn').textContent=p.n;document.getElementById('pd').textContent=p.tag;
  document.getElementById('cont').textContent=(i+1)+'/5';
}
function ir(i){ts[Math.max(0,Math.min(4,i))].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)marcar(e.target._i)})},{root:T,rootMargin:'0px -49% 0px -49%'});
ts.forEach(function(t){io.observe(t)});
document.getElementById('ant').onclick=function(){ir(act-1)};document.getElementById('sig').onclick=function(){ir(act+1)};
addEventListener('keydown',function(e){if(e.key==='ArrowRight')ir(act+1);if(e.key==='ArrowLeft')ir(act-1)});
marcar(0);
</script></body></html>
